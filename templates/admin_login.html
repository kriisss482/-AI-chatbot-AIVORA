<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Aivora — Admin Control Gateway</title>
  
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "aivora-bg": "#090d16",
            "aivora-surface": "#0f1624",
            "aivora-card": "#131b2e",
            "aivora-border": "#1e293b",
            "aivora-accent": "#38bdf8",
            "aivora-purple": "#a855f7",
            "aivora-red": "#ef4444"
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }
      }
    }
  </script>
</head>

<body class="bg-aivora-bg text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans relative">
  <div class="fixed inset-0 bg-[radial-gradient(circle_at_50%_0%,rgba(56,189,248,0.15)_0%,transparent_60%)] pointer-events-none"></div>

  <div class="max-w-md w-full bg-aivora-surface border border-aivora-border rounded-3xl p-8 shadow-2xl relative z-10">
    <div class="flex flex-col items-center text-center space-y-3 mb-8">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-aivora-accent to-aivora-purple p-[2px] shadow-[0_0_25px_rgba(56,189,248,0.4)] flex items-center justify-center">
        <div class="w-full h-full bg-aivora-bg rounded-[14px] flex items-center justify-center">
          <span class="material-symbols-outlined text-aivora-accent text-[28px]">admin_panel_settings</span>
        </div>
      </div>
      <div>
        <h1 class="text-2xl font-bold text-white tracking-tight">Admin Gateway</h1>
        <p class="text-xs text-slate-400 mt-1">Restricted access • Only system administrators</p>
      </div>
    </div>

    {% if error %}
    <div class="mb-5 p-3.5 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs flex items-center gap-2">
      <span class="material-symbols-outlined text-[18px]">error</span>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="POST" action="/admin/login" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Admin Email</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3.5 top-3 text-[18px] text-slate-500">mail</span>
          <input type="email" name="email" required placeholder="admin@aivora.ai" value="admin@aivora.ai"
                 class="w-full bg-aivora-card border border-aivora-border rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-aivora-accent transition-colors"/>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Password</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3.5 top-3 text-[18px] text-slate-500">lock</span>
          <input type="password" name="password" required placeholder="••••••••"
                 class="w-full bg-aivora-card border border-aivora-border rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-aivora-accent transition-colors"/>
        </div>
      </div>

      <button type="submit" class="w-full mt-2 py-3 rounded-xl bg-gradient-to-r from-aivora-accent to-aivora-purple hover:opacity-95 text-slate-900 font-bold text-sm shadow-[0_0_20px_rgba(56,189,248,0.3)] transition-all cursor-pointer">
        Enter Admin Dashboard
      </button>
    </form>

    <div class="mt-6 text-center">
      <a href="/" class="text-xs text-slate-400 hover:text-aivora-accent transition-colors flex items-center justify-center gap-1">
        <span class="material-symbols-outlined text-[14px]">arrow_back</span>
        Return to Aivora Chat
      </a>
    </div>
  </div>
</body>
</html>
